</style></head><body><div class="shell"><header class="header"><img class="crest" src="escudo.png" alt="Escudo Hercílio Luz"><div class="identity"><div class="heading">HERCÍLIO LUZ</div><div class="sub">FUTEBOL CLUBE</div></div><div class="brand-right"><div class="brand-right-text"><span>IDENTIDADE</span>HERCÍLIO</div><img class="monogram" src="monograma.png" alt="Monograma Identidade Hercílio"></div></header><main class="main"><section class="video-panel" id="videoPanel"><video id="clubVideo" autoplay muted loop playsinline webkit-playsinline preload="auto"><source src="video.mp4" type="video/mp4"></video><div class="video-fallback"><strong>IDENTIDADE HERCÍLIO</strong><small id="videoStatus">Carregando vídeo institucional...</small></div><div class="video-tag">HERCÍLIO LUZ FC · CONTEÚDO INSTITUCIONAL</div></section><aside class="side"><section class="card schedule"><h2>PROGRAMAÇÃO DO DIA</h2><div id="schedule"></div></section><section class="card match"><h2>PRÓXIMO JOGO</h2><div class="match-title" id="matchTitle"></div><div class="match-info" id="matchInfo"></div></section></aside></main><div class="ticker"><div class="ticker-label">COMUNICADOS</div><div class="ticker-text" id="notice"></div></div><footer class="footer"><span>HONRAR A HISTÓRIA. <strong>CONSTRUIR O FUTURO.</strong></span><span>IDENTIDADE HERCÍLIO</span></footer></div><script>
